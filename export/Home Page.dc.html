  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"359dcc5f-a771-41d1-9142-41c8f688dd43\"><\u002Fscript>\n<script src=\"e45b846c-3edb-4e22-995a-322621b64cc9\"><\u002Fscript>\n<style>\nbody{margin:0;background:#f3efe3;color:#1c1c1a}\na{color:#c1502e;text-decoration:none}\na:hover{color:#9c3f24}\n.btn{transition:transform .2s ease,box-shadow .2s ease}\n.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 22px rgba(27,67,50,.3)}\n\n@keyframes k-bob{0%{transform:translate3d(0,0,0) rotate(-4deg)}50%{transform:translate3d(-10px,4px,0) rotate(4deg)}100%{transform:translate3d(0,0,0) rotate(-4deg)}}\n@keyframes k-float{0%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-8px)}100%{transform:translate(-50%,-50%) translateY(0)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"page-root\" style=\"min-height:100%;background:#f3efe3;font-family:var(--font-body)\">\n\n    <div class=\"nav\" style=\"display:flex;align-items:center;gap:28px;padding:14px 40px;background:#f3efe3;border-bottom:none;box-shadow:none\">\n    <a href=\"Home Page.dc.html\" style=\"margin-right:auto;display:flex\"><img src=\"a8d41483-fe40-4a45-9309-60449a7eb70b\" alt=\"Ketto Outdoors\" style=\"height:76px\"><\u002Fa>\n    <a href=\"New to Fishing.dc.html\" style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#1c1c1a\">New to Fishing<\u002Fa>\n    <a href=\"Ketto Shop.dc.html\" class=\"btn\" style=\"text-decoration:none;background:#1b4332;color:#f3efe3;border:none\">Shop Gear<\u002Fa>\n    <button sc-camel-on-click=\"{{ toggleCart }}\" aria-label=\"Cart\" style=\"position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:2px solid #1b4332;color:#1b4332;background:transparent;cursor:pointer\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"><\u002Fcircle><circle cx=\"20\" cy=\"21\" r=\"1\"><\u002Fcircle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"><\u002Fpath><\u002Fsvg>\n      <sc-if value=\"{{ hasItems }}\">\n        <span style=\"position:absolute;top:-4px;right:-4px;background:#c1502e;color:#f3efe3;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px\">{{ cartCount }}<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ toggleMenu }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:60\"><\u002Fdiv>\n    <div style=\"position:fixed;top:0;right:0;bottom:0;width:280px;max-width:80vw;background:#1b4332;z-index:61;box-shadow:-8px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:24px;gap:4px\">\n      <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Close menu\" style=\"align-self:flex-end;background:none;border:none;color:#f3efe3;font-size:22px;cursor:pointer;margin-bottom:12px\">×<\u002Fbutton>\n      <a href=\"Home Page.dc.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px;border-bottom:1px solid rgba(243,239,227,.15)\">Home<\u002Fa>\n      <a href=\"New to Fishing.dc.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px;border-bottom:1px solid rgba(243,239,227,.15)\">New to Fishing<\u002Fa>\n      <a href=\"Ketto Shop.dc.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px;border-bottom:1px solid rgba(243,239,227,.15)\">Shop Gear<\u002Fa>\n      <button sc-camel-on-click=\"{{ openCartFromMenu }}\" style=\"color:#f3efe3;background:none;border:none;text-align:left;font-size:16px;padding:14px 8px;cursor:pointer\">Cart<sc-if value=\"{{ hasItems }}\"> ({{ cartCount }})<\u002Fsc-if><\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"position:relative;overflow:hidden;background:#e6ede8;min-height:468px;display:flex;align-items:center;justify-content:center\">\n    <div style=\"position:absolute;inset:0;background:linear-gradient(to bottom,rgba(27,67,50,.03),rgba(27,67,50,.14))\"><\u002Fdiv>\n    <image-slot id=\"hero-nature-fishing\" shape=\"rect\" placeholder=\"Drop a nature/fishing photo (angler casting, lake, rod in hand)\" style=\"position:absolute;top:-6%;left:0;width:100%;height:112%;z-index:0;border:none;outline:none\"><\u002Fimage-slot>\n    <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;background:rgba(243,239,227,.72);backdrop-filter:blur(4px);padding:44px 60px;display:flex;align-items:center;gap:40px;text-align:left;max-width:840px;border-left:6px solid #c1502e;box-shadow:0 24px 60px rgba(27,67,50,.25)\">\n      <div style=\"display:flex;flex-direction:column-reverse;gap:16px\">\n        <div style=\"font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#c1502e;font-weight:700\">Fisherman-friendly tackle<\u002Fdiv>\n        <h1 style=\"font-size:58px;line-height:.94;letter-spacing:-0.04em;margin:0\">GEAR THAT<br>WORKS.<\u002Fh1>\n      <\u002Fdiv>\n      <a href=\"Ketto Shop.dc.html\" class=\"btn\" style=\"text-decoration:none;background:#1b4332;color:#f3efe3;border:none;white-space:nowrap;padding:16px 28px;font-size:14px;letter-spacing:.04em;box-shadow:0 6px 18px rgba(27,67,50,.35);transition:transform .2s ease,box-shadow .2s ease\" style-hover=\"transform:translateY(-3px) scale(1.03);box-shadow:0 10px 24px rgba(27,67,50,.45)\">Shop Gear<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:36px 40px;text-align:center\">\n    <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Why Ketto<\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:27px;letter-spacing:-0.03em;margin-top:8px;max-width:32ch;margin-left:auto;margin-right:auto\">Most tackle brands just sell you gear.<br>We build fishermen.<\u002Fdiv>\n    <div id=\"why-ketto\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:28px;text-align:left;max-width:920px;margin-left:auto;margin-right:auto\">\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#1b4332;color:#f3efe3;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px\">1<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:-0.02em\">We teach, other brands only sell<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;text-wrap:pretty;opacity:.85\">We built an entire beginner's guide — casting, reeling, reading water — because gear without know-how just sits in a drawer.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#1b4332;color:#f3efe3;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px\">2<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:-0.02em\">We match lure to person, not lure to price<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;text-wrap:pretty;opacity:.85\">Every lure lists the exact species it catches, the angler it's built for, and a real difficulty score — so you buy the right gear for your water.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"width:28px;height:28px;border-radius:50%;background:#1b4332;color:#f3efe3;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px\">3<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:16px;letter-spacing:-0.02em\">Every lure earns its spot<\u002Fdiv>\n        <p style=\"margin:0;font-size:13px;text-wrap:pretty;opacity:.85\">We cast, retrieve, and tune every lure ourselves before it ever reaches the catalog — so it performs the first time you tie it on.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#e9ecdf;padding-bottom:8px\">\n  <div style=\"padding:56px 40px 0;text-align:center\">\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:44px;letter-spacing:-0.03em\">Featured Gear<\u002Fdiv>\n    <p style=\"margin:12px 0 0;font-size:14px;opacity:.7\">We surveyed the fish. They didn't answer, but these three get bit the most anyway.<\u002Fp>\n    <div style=\"width:64px;height:3px;background:transparent;margin:16px auto 0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"text-align:center;padding-bottom:12px;font-size:12px;color:#c1502e;font-weight:700;letter-spacing:.06em;text-transform:uppercase\">Admin mode — pick featured products below<\u002Fdiv>\n  <\u002Fsc-if>\n  <div id=\"lures\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:0 40px 56px\">\n    <sc-for list=\"{{ featuredCards }}\" as=\"card\" hint-placeholder-count=\"3\">\n      <div style=\"padding:32px;display:flex;flex-direction:column;gap:14px;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(27,67,50,.1)\">\n        <sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-raw-select value=\"{{ card.key }}\" sc-camel-on-change=\"{{ card.onPick }}\" style=\"font-size:13px;padding:8px 10px;border:2px solid #1b4332;background:#f3efe3;color:#1c1c1a;font-weight:700\">\n            <sc-for list=\"{{ card.options }}\" as=\"opt\" hint-placeholder-count=\"5\">\n              <option value=\"{{ opt.key }}\">{{ opt.name }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ card.isImg }}\" hint-placeholder-val=\"{{ true }}\">\n          <a href=\"{{ card.href }}\" style=\"background:#eae9e9;height:180px;display:flex;align-items:center;justify-content:center;overflow:hidden\">\n            <img src=\"{{ card.imgSrc }}\" alt=\"{{ card.name }}\" style=\"width:60%;object-fit:contain\">\n          <\u002Fa>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ card.isSlot }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"height:180px\">\n            <image-slot id=\"{{ card.slotId }}\" shape=\"rect\" placeholder=\"{{ card.placeholder }}\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div class=\"card-kicker\">{{ card.kicker }}<\u002Fdiv>\n        <div style=\"display:inline-flex;align-self:flex-start;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:#1b4332;color:#f3efe3;padding:4px 10px\">{{ card.badge }}<\u002Fdiv>\n        <a href=\"{{ card.href }}\" style=\"font-family:var(--font-heading);font-weight:800;font-size:24px;letter-spacing:-0.02em;color:#1c1c1a\">{{ card.name }}<\u002Fa>\n        <div style=\"font-size:12px;letter-spacing:.04em;color:#1c1c1a;opacity:.7\">{{ card.sub }}<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;text-wrap:pretty\">{{ card.desc }}<\u002Fp>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;margin-top:auto\">${{ card.price }}<\u002Fdiv>\n        <div style=\"display:flex;gap:10px\">\n          <a href=\"{{ card.href }}\" class=\"btn\" style=\"flex:1;text-align:center;text-decoration:none;background:{{ card.ctaBg }};color:{{ card.ctaColor }};border:{{ card.ctaBorder }}\">{{ card.ctaText }}<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(27,67,50,.5);z-index:60;display:flex;align-items:center;justify-content:center\">\n      <div style=\"background:#f3efe3;padding:32px;width:320px;max-width:90vw;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px\">\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:18px\">Admin login<\u002Fdiv>\n        <input type=\"password\" value=\"{{ loginPw }}\" sc-camel-on-change=\"{{ setLoginPw }}\" placeholder=\"Password\" style=\"padding:10px 12px;border:2px solid rgba(27,67,50,.25);font-size:14px\">\n        <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"color:#c1502e;font-size:13px\">Incorrect password.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:10px\">\n          <button sc-camel-on-click=\"{{ submitLogin }}\" class=\"btn\" style=\"flex:1;background:#1b4332;color:#f3efe3;border:none;cursor:pointer\">Unlock<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeLogin }}\" style=\"flex:1;background:transparent;border:2px solid #1b4332;color:#1b4332;cursor:pointer;border-radius:6px\">Cancel<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<sc-if value=\"{{ cartOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ toggleCart }}\" style=\"position:fixed;inset:0;background:rgba(27,67,50,.35);z-index:20\"><\u002Fdiv>\n    <div style=\"position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:#f3efe3;z-index:21;box-shadow:-8px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column\">\n      <div style=\"padding:24px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid rgba(27,67,50,.15)\">\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px\">Your Cart<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ toggleCart }}\" aria-label=\"Close cart\" style=\"background:none;border:none;font-size:20px;cursor:pointer;color:#1c1c1a\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:18px\">\n        <sc-if value=\"{{ hasItems }}\" hint-placeholder-val=\"{{ true }}\">\n          <sc-for list=\"{{ cartItems }}\" as=\"item\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;gap:12px;align-items:center\">\n              <div style=\"flex:1\">\n                <div style=\"font-weight:700;font-size:15px\">{{ item.name }}<\u002Fdiv>\n                <div style=\"font-size:13px;opacity:.7\">${{ item.price }}<\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ item.dec }}\" style=\"width:26px;height:26px;border-radius:50%;border:1px solid #1b4332;background:transparent;color:#1b4332;cursor:pointer\">−<\u002Fbutton>\n              <span style=\"min-width:16px;text-align:center;font-size:14px\">{{ item.qty }}<\u002Fspan>\n              <button sc-camel-on-click=\"{{ item.inc }}\" style=\"width:26px;height:26px;border-radius:50%;border:1px solid #1b4332;background:transparent;color:#1b4332;cursor:pointer\">+<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ item.remove }}\" aria-label=\"Remove\" style=\"background:none;border:none;color:#c1502e;cursor:pointer;font-size:13px;text-decoration:underline\">Remove<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ cartEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"opacity:.7;font-size:14px\">Your cart is empty.<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"padding:24px;border-top:2px solid rgba(27,67,50,.15)\">\n        <div style=\"display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin-bottom:14px\">\n          <span>Total<\u002Fspan><span>${{ cartTotal }}<\u002Fspan>\n        <\u002Fdiv>\n        <a href=\"Ketto Shop.dc.html\" class=\"btn\" style=\"display:block;text-align:center;text-decoration:none;background:#1b4332;color:#f3efe3;border:none\">Continue Shopping<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"height:4px;background:#c1502e\"><\u002Fdiv>\n\n  <div id=\"start\" style=\"padding:56px 40px\">\n    <div style=\"text-align:center;margin-bottom:36px\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Not sure where to start?<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:44px;letter-spacing:-0.03em;margin-top:8px\">Three Steps To Your First Catch<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:32px;position:relative\">\n      <div id=\"step-track\" style=\"position:absolute;top:15px;left:16.66%;right:16.66%;height:2px;background:rgba(27,67,50,.15);z-index:0\">\n        <div id=\"step-track-fill\" style=\"height:100%;width:0%;background:#c1502e;transition:width .25s ease\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"step-col\" style=\"display:flex;flex-direction:column;gap:10px;position:relative;z-index:1\">\n        <div class=\"step-badge\" style=\"width:30px;height:30px;border-radius:50%;border:2px solid rgba(27,67,50,.3);color:#1b4332;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px;background:#f3efe3;transition:all .25s ease\">1<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.02em\">Pick your fish and fishing spot<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;text-wrap:pretty\">Know what you're after and where you'll cast — a pond, lake, or river — so you can pick a lure that actually matches the water.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step-col\" style=\"display:flex;flex-direction:column;gap:10px;position:relative;z-index:1\">\n        <div class=\"step-badge\" style=\"width:30px;height:30px;border-radius:50%;border:2px solid rgba(27,67,50,.3);color:#1b4332;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px;background:#f3efe3;transition:all .25s ease\">2<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.02em\">Pick one lure to start<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;text-wrap:pretty\">You don't need a full box. One good crankbait, or soft plastic with the right setup, matched to your fish and spot, will catch fish in almost any lake or pond.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"step-col\" style=\"display:flex;flex-direction:column;gap:10px;position:relative;z-index:1\">\n        <div class=\"step-badge\" style=\"width:30px;height:30px;border-radius:50%;border:2px solid rgba(27,67,50,.3);color:#1b4332;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-weight:800;font-size:13px;background:#f3efe3;transition:all .25s ease\">3<\u002Fdiv>\n        <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.02em\">Cast, reel, land the fish<\u002Fdiv>\n        <p style=\"margin:0;font-size:14px;text-wrap:pretty\">Cast out, reel at the correct pace for the rig you have, and when you feel a sharp tug keep reeling — the hook does the rest.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"text-align:center;font-size:13px;max-width:60ch;margin:32px auto 0;text-wrap:pretty;opacity:.8\">New to fishing? Every Ketto lure is hand-picked so it works right out of the package — no tuning, no guesswork. <a href=\"New to Fishing.dc.html\" style=\"color:#c1502e;font-weight:600\">Learn the basics →<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:#1b4332;color:#f3efe3;padding:80px 40px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;justify-content:space-between;position:relative\">\n    <div style=\"position:absolute;top:0;left:0;right:0;height:4px;background:#c1502e\"><\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:60px;line-height:.96;letter-spacing:-0.035em;max-width:20ch\">STOP GUESSING. START FISHING.<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start\">\n      <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.9\">Ketto Outdoors — Full lineup<\u002Fdiv>\n      <a href=\"Ketto Shop.dc.html\" class=\"btn\" style=\"background:#c1502e;color:#f3efe3;text-decoration:none;border:none;padding:16px 28px;box-shadow:0 6px 18px rgba(0,0,0,.25)\">Shop all gear<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:40px;justify-content:center;padding:56px 40px;background:#2b2b2b;position:relative\">\n    <div style=\"position:absolute;top:0;left:0;right:0;height:3px;background:#c1502e\"><\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;min-width:160px;text-align:center;align-items:center\">\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:18px;color:#f3efe3;letter-spacing:-0.02em\">Ketto Outdoors<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:4px;align-items:center\">\n        <a href=\"Home Page.dc.html\" style=\"font-size:13px;font-weight:600;color:#f3efe3;opacity:.75;transition:opacity .15s\">Home<\u002Fa>\n        <a href=\"Ketto Shop.dc.html\" style=\"font-size:13px;font-weight:600;color:#f3efe3;opacity:.75;transition:opacity .15s\">Shop all gear<\ aw.every((k) => FEATURED_CATALOG[k])) return raw;\n  } catch (e) {}\n  return FEATURED_DEFAULT.slice();\n}\nfunction saveFeatured(arr) { try { localStorage.setItem(FEATURED_KEY, JSON.stringify(arr)); } catch (e) {} }\n\nconst CATALOG = {\n  'deep-six': { name: 'Deep Six', price: 14.50 },\n  'baithooks': { name: 'Baithooks', price: 4.25 },\n  'spinning-combo': { name: \"Spinning Rod & Reel Combo (5'6\\\")\", price: 54.99 },\n  'baitcaster': { name: 'Baitcaster Combo', price: 72.99 },\n  'longshot': { name: 'Longshot', price: 11.00 },\n  'chugger': { name: 'Chugger', price: 12.75 },\n};\n\nfunction loadCart() {\n  try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; } catch (e) { return {}; }\n}\nfunction saveCart(cart) {\n  try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {}\n}\n\nclass Component extends DCLogic {\n  state = { cartOpen: false, cart: loadCart(), menuOpen: false, isAdmin: loadAdmin(), showLogin: false, loginPw: '', loginError: false, featured: loadFeatured() };\n\n  toggleMenu() { this.setState((s) => ({ menuOpen: !s.menuOpen })); }\n  openCartFromMenu() { this.setState({ menuOpen: false, cartOpen: true }); }\n\n  adminLinkClick() {\n    if (this.state.isAdmin) { saveAdmin(false); this.setState({ isAdmin: false }); }\n    else this.setState({ showLogin: true, loginError: false, loginPw: '' });\n  }\n  closeLogin() { this.setState({ showLogin: false }); }\n  setLoginPw(e) { this.setState({ loginPw: e.target.value }); }\n  submitLogin() {\n    if (this.state.loginPw === ADMIN_PASSWORD) { saveAdmin(true); this.setState({ isAdmin: true, showLogin: false, loginPw: '' }); }\n    else this.setState({ loginError: true });\n  }\n  setFeaturedSlot(index, key) {\n    this.setState((s) => {\n      const featured = s.featured.slice();\n      featured[index] = key;\n      saveFeatured(featured);\n      return { featured };\n    });\n  }\n\n  componentDidMount() {\n    if (!window.__kettoAdminKeyListener) {\n      window.__kettoAdminKeyListener = true;\n      window.addEventListener('keydown', (e) => {\n        if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a')) {\n          e.preventDefault();\n          if (!this.state.isAdmin) this.setState({ showLogin: true, loginError: false, loginPw: '' });\n        }\n      });\n    }\n    if (!window.__kettoFabListener) {\n      window.__kettoFabListener = true;\n      window.addEventListener('scroll', () => {\n        const fab = document.getElementById('ketto-fab');\n        if (!fab) return;\n        const show = window.scrollY > 280;\n        fab.style.opacity = show ? '1' : '0';\n        fab.style.pointerEvents = show ? 'auto' : 'none';\n      });\n    }\n    initScrollReveal();\n    (() => {\n      const section = document.getElementById('start');\n      const steps = section ? Array.prototype.slice.call(section.querySelectorAll('.step-col')) : [];\n      const fill = document.getElementById('step-track-fill');\n      const track = document.getElementById('step-track');\n      if (!section || !steps.length) return;\n      steps.forEach((el) => { el.style.transition = 'opacity .3s ease, transform .3s ease'; });\n      const positionTrack = () => {\n        if (!track) return;\n        const firstBadge = steps[0].querySelector('.step-badge');\n        const lastBadge = steps[steps.length - 1].querySelector('.step-badge');\n        if (!firstBadge || !lastBadge) return;\n        const gridRect = track.parentElement.getBoundingClientRect();\n        const r1 = firstBadge.getBoundingClientRect();\n        const r2 = lastBadge.getBoundingClientRect();\n        track.style.left = (r1.left + r1.width / 2 - gridRect.left) + 'px';\n        track.style.right = (gridRect.right - (r2.left + r2.width / 2)) + 'px';\n      };\n      positionTrack();\n      window.addEventListener('resize', positionTrack);\n      const onScroll = () => {\n        const rect = section.getBoundingClientRect();\n        const vh = window.innerHeight;\n        const atBottom = window.scrollY + vh >= document.documentElement.scrollHeight - 2;\n        const raw = atBottom ? 1 : (vh - rect.top) / (rect.height + vh);\n        const progress = Math.min(1, Math.max(0, raw));\n        let active = -1;\n        if (progress >= 0.2 && progress < 0.4) active = 0;\n        else if (progress >= 0.4 && progress < 0.6) active = 1;\n        else if (progress >= 0.6 && progress < 0.8) active = 2;\n        // Fill tracks continuously from step1's badge to step3's badge across\n        // the 0.2–0.8 window, then holds full once past it, empties before it.\n        const fillPct = Math.min(1, Math.max(0, (progress - 0.2) / 0.6)) * 100;\n        if (fill) fill.style.width = (progress < 0.2 ? 0 : progress >= 0.8 ? 100 : fillPct) + '%';\n        steps.forEach((el, i) => {\n          const badge = el.querySelector('.step-badge');\n          const passed = progress >= 0.2 + (i + 1) * 0.2;\n          if (active === -1 && progress < 0.2) {\n            el.style.opacity = '1';\n            el.style.transform = 'scale(1)';\n            if (badge) { badge.style.background = '#f3efe3'; badge.style.color = '#1b4332'; badge.style.borderColor = 'rgba(27,67,50,.3)'; badge.style.transform = 'scale(1)'; }\n          } else if (i === active) {\n            el.style.opacity = '1';\n            el.style.transform = 'scale(1.04)';\n            if (badge) { badge.style.background = '#c1502e'; badge.style.color = '#f3efe3'; badge.style.borderColor = '#c1502e'; badge.style.transform = 'scale(1.15)'; }\n          } else {\n            el.style.opacity = passed || progress >= 0.8 ? '1' : '0.4';\n            el.style.transform = 'scale(1)';\n            if (badge) {\n              if (passed) { badge.style.background = '#1b4332'; badge.style.color = '#f3efe3'; badge.style.borderColor = '#1b4332'; }\n              else { badge.style.background = '#f3efe3'; badge.style.color = '#1b4332'; badge.style.borderColor = 'rgba(27,67,50,.3)'; }\n              badge.style.transform = 'scale(1)';\n            }\n          }\n        });\n      };\n      window.addEventListener('scroll', onScroll);\n      onScroll();\n    })();\n    (() => {\n      const row = document.getElementById('why-ketto');\n      if (!row) return;\n      row.style.perspective = '900px';\n      const kids = Array.prototype.slice.call(row.children);\n      kids.forEach((el) => {\n        el.style.opacity = '0';\n        el.style.transform = 'rotateX(-70deg)';\n        el.style.transformOrigin = 'top center';\n        el.style.transition = 'opacity .5s ease, transform .6s cubic-bezier(.34,1.56,.64,1)';\n        const badge = el.querySelector('div');\n        if (badge) {\n          badge.style.transform = 'scale(0)';\n          badge.style.transition = 'transform .5s cubic-bezier(.34,1.76,.64,1)';\n        }\n      });\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((entry) => {\n          const i = kids.indexOf(entry.target);\n          if (entry.isIntersecting) {\n            entry.target.style.transitionDelay = (i * 0.12) + 's';\n            entry.target.style.opacity = '1';\n            entry.target.style.transform = 'rotateX(0deg)';\n            const badge = entry.target.querySelector('div');\n            if (badge) {\n              badge.style.transitionDelay = (i * 0.12 + 0.15) + 's';\n              badge.style.transform = 'scale(1)';\n            }\n          } else {\n            entry.target.style.transitionDelay = '0s';\n            entry.target.style.opacity = '0';\n            entry.target.style.transform = 'rotateX(-70deg)';\n            const badge = entry.target.querySelector('div');\n            if (badge) { badge.style.transitionDelay = '0s'; badge.style.transform = 'scale(0)'; }\n          }\n        });\n      }, { threshold: 0.25 });\n      kids.forEach((el) => io.observe(el));\n    })();\n    const cards = document.querySelectorAll('#lures > div');\n    const dirs = ['translateX(-60px)', 'translateY(40px)', 'translateX(60px)'];\n    cards.forEach((el, i) => {\n      el.style.opacity = '0';\n      el.style.transform = dirs[i] || 'translateY(40px)';\n      el.style.transition = 'opacity .7s ease, transform .7s ease';\n    });\n    cards.forEach((el) => {\n      el.style.borderTop = '4px solid transparent';\n      el.style.boxSizing = 'border-box';\n      el.addEventListener('mouseenter', () => {\n        cards.forEach((c) => {\n          c.style.transition += ', filter .25s ease, transform .25s ease, border-color .25s ease';\n          if (c === el) {\n            c.style.transform = 'scale(1.05)';\n            c.style.filter = 'none';\n            c.style.borderTopColor = '#c1502e';\n            c.style.zIndex = '2';\n            c.style.position = 'relative';\n          } else {\n            c.style.filter = 'blur(2px)';\n            c.style.opacity = '0.6';\n          }\n        });\n      });\n      el.addEventListener('mouseleave', () => {\n        cards.forEach((c) => {\n          c.style.transform = 'translate(0,0)';\n          c.style.filter = 'none';\n          c.style.opacity = '1';\n          c.style.borderTopColor = 'transparent';\n          c.style.zIndex = '';\n        });\n      });\n    });\n    const cardIo = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        const i = Array.prototype.indexOf.call(cards, entry.target);\n        if (entry.isIntersecting) {\n          entry.target.style.opacity = '1';\n          entry.target.style.transform = 'translate(0,0)';\n        } else {\n          entry.target.style.opacity = '0';\n          entry.target.style.transform = dirs[i] || 'translateY(40px)';\n        }\n      });\n    }, { threshold: 0.2 });\n    cards.forEach((el) => cardIo.observe(el));\n  }\n\n  _mutate(fn) {\n    const cart = Object.assign({}, this.state.cart);\n    fn(cart);\n    saveCart(cart);\n    this.setState({ cart });\n  }\n  add(id) {\n    this._mutate((cart) => { cart[id] = (cart[id] || 0) + 1; });\n    this.setState({ ca
