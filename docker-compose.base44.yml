services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./docs:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped
