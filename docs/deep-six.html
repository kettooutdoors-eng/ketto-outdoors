document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

t);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; g ow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"da839a51-3209-4fb6-aade-8f284686d3c1\"><\u002Fscript>\n<script src=\"4fdceb3a-8c12-4610-9127-cd1f50481851\"><\u002Fscript>\n<style>\nbody{margin:0;background:#f3efe3;color:#1c1c1a}\na{color:#c1502e;text-decoration:none}\na:hover{color:#9c3f24}\n.btn{transition:transform .2s ease,box-shadow .2s ease}\n.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 22px rgba(27,67,50,.3)}\n@keyframes k-wobble{0%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(6deg) translateY(-2px)}100%{transform:rotate(-6deg) translateY(0)}}\n@keyframes k-yaw{0%{transform:rotate(-9deg) translateX(0)}25%{transform:rotate(3deg) translateX(3px)}50%{transform:rotate(10deg) translateX(0)}75%{transform:rotate(-3deg) translateX(-3px)}100%{transform:rotate(-9deg) translateX(0)}}\n@keyframes k-flex{0%{transform:skewY(2.5deg) scaleX(.97)}25%{transform:skewY(-1deg) scaleX(1.01)}50%{transform:skewY(-2.5deg) scaleX(.97)}75%{transform:skewY(1deg) scaleX(1.01)}100%{transform:skewY(2.5deg) scaleX(.97)}}\n@keyframes k-hook-front{0%{transform:rotate(-13deg)}25%{transform:rotate(9deg)}50%{transform:rotate(18deg)}75%{transform:rotate(-6deg)}100%{transform:rotate(-13deg)}}\n@keyframes k-hook-rear{0%{transform:rotate(-16deg)}25%{transform:rotate(11deg)}50%{transform:rotate(21deg)}75%{transform:rotate(-8deg)}100%{transform:rotate(-16deg)}}\n@keyframes k-crank{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}\n@keyframes k-bob{0%{transform:translate3d(0,0,0)}25%{transform:translate3d(-16px,-2px,0)}50%{transform:translate3d(-4px,2px,0)}75%{transform:translate3d(-20px,-1px,0)}100%{transform:translate3d(0,0,0)}} {opacity:0}52%{opacity:.55}64%{opacity:0}100%{opacity:0}}\n@keyframes k-label{0%,50%{opacity:0;transform:translateY(10px)}54%{opacity:1;transform:translateY(0)}74%{opacity:1;transform:translateY(0)}80%{opacity:0;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}\n@keyframes k-snap{0%,48%{transform:rotate(-1deg);opacity:.9}53%{transform:rotate(-16deg);opacity:1}60%{transform:rotate(-30deg);opacity:.5}70%,100%{transform:rotate(-1deg);opacity:.9}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"page-root\" style=\"min-height:100%;background:#f3efe3;font-family:var(--font-body)\">\n\n    <div class=\"nav\" style=\"display:flex;align-items:center;gap:28px;padding:14px 40px;background:#f3efe3;border-bottom:none;box-shadow:none\">\n    <a href=\"index.html\" style=\"margin-right:auto;display:flex\"><img src=\"77317a77-287f-4650-b8ef-8aeb1c37ee5a\" alt=\"Ketto Outdoors\" style=\"height:76px\"><\u002Fa>\n    <a href=\"new-to-fishing.html\" style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#1c1c1a\">New to Fishing<\u002Fa>\n    <a href=\"shop.html\" class=\"btn\" style=\"text-decoration:none;background:#1b4332;color:#f3efe3;border:none\">Shop Gear<\u002Fa>\n    <a href=\"shop.html\" aria-label=\"Cart\" style=\"display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;border:2px solid #1b4332;color:#1b4332\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"21\" r=\"1\"><\u002Fcircle><circle cx=\"20\" cy=\"21\" r=\"1\"><\u002Fcircle><path d=\"M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6\"><\u002Fpath><\u002Fsvg>\n    <\u002Fa>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ toggleMenu }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:60\"><\u002Fdiv>\n    <div style=\"position:fixed;top:0;right:0;bottom:0;width:280px;max-width:80vw;background:#1b4332;z-index:61;box-shadow:-8px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:24px;gap:4px\">\n      <button sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Close menu\" style=\"align-self:flex-end;background:none;border:none;color:#f3efe3;font-size:22px;cursor:pointer;margin-bottom:12px\">×<\u002Fbutton>\n      <a href=\"index.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px;border-bottom:1px solid rgba(243,239,227,.15)\">Home<\u002Fa>\n      <a href=\"new-to-fishing.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px;border-bottom:1px solid rgba(243,239,227,.15)\">New to Fishing<\u002Fa>\n      <a href=\"shop.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px;border-bottom:1px solid rgba(243,239,227,.15)\">Shop Gear<\u002Fa>\n      <a href=\"shop.html\" style=\"color:#f3efe3;text-decoration:none;font-size:16px;padding:14px 8px\">Cart<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"display:grid;grid-template-columns:minmax(300px,1fr) 2fr;border-bottom:1px solid rgba(28,28,26,.12)\">\n    <div style=\"padding:48px 40px;border-right:1px solid rgba(28,28,26,.12);display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Squarebill / 2.5 in / 1/2 oz<\u002Fdiv>\n      <h1 style=\"font-size:72px;line-height:.94;letter-spacing:-0.035em;margin:0\">DEEP<br>SIX<\u002Fh1>\n      <p style=\"font-size:16px;max-width:34ch;margin:0;text-wrap:pretty\">A wide-hunting squarebill that runs six feet and deflects instead of hanging. Balanced on the pause, hard on the strike.<\u002Fp>\n      <p style=\"font-size:13px;margin:0;color:#c1502e;font-weight:600\">Target fish: Largemouth &amp; smallmouth bass<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px solid rgba(28,28,26,.15)\">\n        <div class=\"card-kicker\">Motion study<\u002Fdiv>\n        <div class=\"seg\" style=\"display:flex;width:100%;border:1px solid rgba(28,28,26,.25)\">\n          <button sc-camel-on-click=\"{{ showSwim }}\" style=\"{{ swimBtnStyle }}\">Swim<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ showReel }}\" style=\"{{ reelBtnStyle }}\">Reel<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:13px;color:#1c1c1a;opacity:.75;min-height:38px\">{{ modeNote }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;overflow:hidden;background:#eae9e9;min-height:520px\">\n      <div style=\"position:absolute;inset:0;background:linear-gradient(to bottom,rgba(28,28,26,.03),rgba(28,28,26,.13))\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:-40px -160px;background:repeating-linear-gradient(100deg,transparent 0,transparent 70px,rgba(28,28,26,.07) 70px,rgba(28,28,26,.07) 74px,transparent 74px,transparent 130px,rgba(32,30,29,.05) 130px,rgba(32,30,29,.05) 133px);filter:blur(1px);animation:k-drift 2.4s linear infinite\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:-40px -160px;background:repeating-linear-gradient(80deg,transparent 0,transparent 95px,rgba(28,28,26,.06) 95px,rgba(28,28,26,.06) 98px);filter:blur(2px);animation:k-drift 3.6s linear infinite reverse\"><\u002Fdiv>\n      <div style=\"position:absolute;left:40px;top:28px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55\">Depth 6 ft<\u002Fdiv>\n      <div style=\"position:absolute;right:40px;bottom:26px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55\">{{ modeLabel }}<\u002Fdiv>\n\n      <sc-if value=\"{{ isSwim }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position:absolute;inset:0\">\n          <div style=\"position:absolute;left:0;top:34%;width:52%;height:2px;background:#1c1c1a;opacity:.85;transform-origin:left center;animation:k-line 2.6s ease-in-out infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;left:44%;top:44%;width:46%;height:2px;background:#c1502e;animation:k-streak 1.1s linear infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;left:46%;top:56%;width:30%;height:2px;background:#1c1c1a;opacity:.5;animation:k-streak 1.35s linear .2s infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;left:48%;top:64%;width:38%;height:2px;background:#1c1c1a;opacity:.4;animation:k-streak 1.6s linear .5s infinite\"><\u002Fdiv>\n          <div style=\"position:absolute;left:12%;top:26%;width:44%;height:44%;animation:k-bob 3.2s ease-in-out infinite\">\n            <div style=\"position:relative;width:100%;height:100%;transform:rotate(28deg)\">\n              <div style=\"position:relative;width:100%;height:100%;transform-origin:80% 48%;animation:k-yaw .58s cubic-bezier(.45,.05,.55,.95) infinite\">\n                <div style=\"position:absolute;left:82%;top:38%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#1c1c1a;z-index:2\"><\u002Fdiv>\n                <div style=\"position:absolute;left:82%;top:38%;width:220%;height:1px;background:rgba(28,28,26,.45);transform-origin:0 50%;transform:rotate(-66deg);z-index:1\"><\u002Fdiv>\n                <img src=\"f6c09c0e-279f-40ea-a069-d2a209c18244\" alt=\"Deep Six squarebill crankbait\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:80% 46%;animation:k-flex .58s cubic-bezier(.45,.05,.55,.95) infinite\">\n                <img src=\"f6c09c0e-279f-40ea-a069-d2a209c18244\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:circle(15% at 82% 55%);transform-origin:82% 40%;animation:k-hook-front .58s cubic-bezier(.3,1.6,.5,1) .07s infinite\">\n                <img src=\"f6c09c0e-279f-40ea-a069-d2a209c18244\" alt=\"\" aria-hidden=\"true\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:contain;clip-path:circle(17% at 32% 70%);transform-origin:36% 52%;animation:k-hook-rear .58s cubic-bezier(.3,1.6,.5,1) .14s infinite\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isReel }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:56px\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:16px\">\n            <div style=\"position:relative;width:150px;height:150px;border:2px solid #1c1c1a;border-radius:50%;display:flex;align-items:center;justify-content:center\">\n              <div style=\"position:absolute;width:6px;height:6px;background:#1c1c1a;border-radius:50%\"><\u002Fdiv>\n              <div style=\"position:absolute;inset:0;animation:k-crank .67s linear infinite\">\n                <div style=\"position:absolute;left:50%;top:6px;width:2px;height:67px;background:#1c1c1a;transform:translateX(-50%)\"><\u002Fdiv>\n                <div style=\"position:absolute;left:50%;top:0;width:14px;height:14px;background:#c1502e;border-radius:50%;transform:translateX(-50%)\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6\">Handle speed<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;max-width:220px\">\n            <div style=\"font-family:var(--font-heading);font-weight:800;font-size:40px;letter-spacing:-0.03em\">2.4 mph<\u002Fdiv>\n            <div style=\"font-size:14px;opacity:.75;text-wrap:pretty\">≈ 90 turns of the handle per minute — about 1.5 cranks every second, steady, no pause.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"spec\" style=\"display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid rgba(28,28,26,.12)\">\n    <div style=\"padding:28px 40px;border-right:1px solid rgba(28,28,26,.12)\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Dive<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:34px;letter-spacing:-0.03em\">6 ft<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 40px;border-right:1px solid rgba(28,28,26,.12)\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Weight<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:34px;letter-spacing:-0.03em\">1/2 oz<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 40px;border-right:1px solid rgba(28,28,26,.12)\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Hooks<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:34px;letter-spacing:-0.03em\">#4 × 2<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:28px 40px\">\n      <div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c1502e\">Pattern<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:34px;letter-spacing:-0.03em\">Sexy Shad<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"build\" style=\"display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid rgba(28,28,26,.12)\">\n    <div style=\"padding:40px;border-right:1px solid rgba(28,28,26,.12);display:flex;flex-direction:column;gap:10px\">\n      <div class=\"card-kicker\">01 — Bill<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.02em\">Square, 45°<\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;text-wrap:pretty\">The corner catches the rock and kicks the body sideways, so contact reads as a direction change rather than a snag.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:40px;border-right:1px solid rgba(28,28,26,.12);display:flex;flex-direction:column;gap:10px\">\n      <div class=\"card-kicker\">02 — Body<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.02em\">Balsa core<\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;text-wrap:pretty\">Buoyant enough to back out of cover on the pause, dense enough to hold the wobble at speed.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:40px;display:flex;flex-direction:column;gap:10px\">\n      <div class=\"card-kicker\">03 — Rattle<\u002Fdiv>\n      <div style=\"font-family:var(--font-heading);font-weight:800;font-size:22px;letter-spacing:-0.02em\">Single knocker<\u002Fdiv>\n      <p style=\"margin:0;font-size:14px;text-wrap:pretty\">One tungsten ball, low and irregular — a thud that carries in stained water instead of a rasp.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"buy\" style=\"background:#1b4332;color:#f3efe3;padding:72px 40px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-end;justify-content:space-between;position:relative\">\n    <div style=\"position:absolute;top:0;left:0;right:0;height:3px;background:#c1502e\"><\u002Fdiv>\n    <div style=\"font-family:var(--font-heading);font-weight:800;font-size:56px;line-height:.96;letter-spacing:-0.035em;max-width:20ch\">RUN IT INTO SOMETHING HARD.<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;align-items:flex-start\">\n      <div style=\"font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.9\">Ketto Outdoors — Deep Six<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;opacity:.7\">Color<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{ colorOptions }}\" as=\"opt\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ opt.onSelect }}\" style=\"{{ opt.chipStyle }}\">{{ opt.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onAdd }}\" disabled=\"{{ addDisabled }}\" style=\"{{ addBtnStyle }}\">{{ addLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <a href=\"shop.html\" style=\"font-size:13px;font-weight:600;color:#f3efe3;opacity:.75\">← Back to all lures<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n  <button id=\"ketto-fab\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menu\" style=\"position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:#1b4332;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:55\">\n    <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f3efe3\" stroke-width=\"2\" stroke-linecap=\"round\"><line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"><\u002Fline><line x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\"><\u002Fline><line x1=\"3\" y1=\"18\" x2=\"21\" y2=\"18\"><\u002Fline><\u002Fsvg>\n  <\u002Fbutton>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;motion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;swim&quot;,&quot;strike&quot;],&quot;default&quot;:&quot;swim&quot;,&quot;tsType&quot;:&quot;'swim' | 'strike'&quot;,&quot;section&quot;:&quot;Hero animation&quot;}}\">\nconst CART_KEY = 'ketto-cart';\nconst COLOR_OPTIONS = [\n  { key: 'a', label: 'Color A' },\n  { key: 'b', label: 'Color B' },\n  { key: 'c', label: 'Color C' },\n  { key: 'd', label: 'Color D' },\n];\nfunction loadCart() { try { return JSON.parse(localStorage.getItem(CART_KEY)) || {}; } catch (e) { return {}; } }\nfunction saveCart(cart) { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} }\n\nclass Component extends DCLogic {\n  state = { mode: null, menuOpen: false, selectedColor: null, added: false };\n  get mode() { return this.state.mode || this.props.motion || \"swim\"; }\n  componentDidMount() {\n    if (!window.__kettoFabListener) {\n      window.__kettoFabListener = true;\n      window.addEventListener('scroll', () => {\n        const fab = document.getElementById('ketto-fab');\n        if (!fab) return;\n        const show = window.scrollY > 280;\n        fab.style.opacity = show ? '1' : '0';\n        fab.style.pointerEvents = show ? 'auto' : 'none';\n      });\n    }\n    const root = document.getElementById('page-root');\n    if (!root) return;\n    const targets = Array.prototype.filter.call(root.children, (el) =>\n      !el.classList.contains('nav') && window.getComputedStyle(el).position !== 'fixed'\n    );\n    targets.forEach((el) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(40px)';\n      el.style.transition = 'opacity .7s ease, transform .7s ease';\n    });\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((entry) => {\n        if (entry.isIntersecting) {\n          entry.target.style.opacity = '1';\n          entry.target.style.transform = 'translateY(0)';\n        } else {\n          entry.target.style.opacity = '0';\n          entry.target.style.transform = 'translateY(40px)';\n        }\n      });\n    }, { threshold: 0.12 });\n    targets.forEach((el) => io.observe(el));\n  }\n  selectColor(key) { this.setState({ selectedColor: key, added: false }); }\n  addToCart() {\n    if (!this.state.selectedColor) return;\n    const label = (COLOR_OPTIONS.find((c) => c.key === this.state.selectedColor) || {}).label;\n    const cart = loadCart();\n    const key = 'deep-six::' + label;\n    cart[key] = (cart[key] || 0) + 1;\n    saveCart(cart);\n    this.setState({ added: true });\n    setTimeout(() => this.setState({ added: false }), 1600);\n  }\n  renderVals() {\n    const m = this.mode;\n    const selectedColor = this.state.selectedColor;\n    const chipBase = 'font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;letter-spacing:.02em;';\n    const base = \"flex:1;text-align:left;padding:8px 14px;font-family:var(--font-heading);font-weight:600;font-size:14px;border:none;cursor:pointer;\";\n    const on = base + \"background:#c1502e;color:#f3efe3;\";\n    const off = base + \"background:transparent;color:#1c1c1a;\";\n    return {\n      swimBtnStyle: m === \"swim\" ? on : off,\n      strikeBtnStyle: m === \"strike\" ? on : off,\n      reelBtnStyle: m === \"reel\" ? on : off,\n      isSwim: m === \"swim\",\n      isReel: m === \"reel\",\n      modeLabel: m === \"swim\" ? \"Retrieve — 2.4 mph\" : \"Reel speed — 2.4 mph\",\n      modeNote: m === \"swim\"\n        ? \"Steady retrieve: the bill loads, the body rolls six degrees each side, and the tail throws water off the back.\"\n        : \"2.4 mph is a brisk, steady retrieve — about 1.5 turns of the reel handle every second, no pausing.\",\n      showSwim: () => this.setState({ mode: \"swim\" }),\n      showReel: () => this.setState({ mode: \"reel\" }),\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState((s) => ({ menuOpen: !s.menuOpen })),\n      colorOptions: COLOR_OPTIONS.map((c) => ({\n        label: c.label,\n        chipStyle: chipBase + (selectedColor === c.key ? 'background:#c1502e;color:#fff;border:1px solid #c1502e;' : 'background:transparent;color:#f3efe3;border:1px solid rgba(243,239,227,.5);'),\n        onSelect: () => this.selectColor(c.key),\n      })),\n      addDisabled: !selectedColor,\n      addLabel: this.state.added ? 'Added ✓' : (selectedColor ? 'Add to cart — $14.50' : 'Pick a color first'),\n      addBtnStyle: 'font-size:14px;font-weight:700;padding:16px 28px;border:none;border-radius:0;cursor:' + (selectedColor ? 'pointer' : 'not-allowed') + ';background:' + (this.state.added ? '#fff' : (selectedColor ? '#c1502e' : 'rgba(243,239,227,.3)')) + ';color:' + (this.state.added ? '#1b4332' : (selectedColor ? '#fff' : '#f3efe3')) + ';box-shadow:0 6px 18px rgba(0,0,0,.25);',\n      onAdd: () => this.addToCart(),\n    };\n  }\n}<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
